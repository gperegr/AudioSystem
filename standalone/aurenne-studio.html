<script>
'use strict';
const values={gain:3,bass:5,mid:5,treble:5,reverb:2,master:3},labels={gain:'GAIN',bass:'BASS',mid:'MIDDLE',treble:'TREBLE',reverb:'REVERB',master:'MASTER'};
let ctx,osc,amp,volume,bass,mid,treble,wet,delay,feedback,powered=false,playing=false;
for(const key of Object.keys(values)){const c=document.createElement('div');c.className='control';c.innerHTML='<div class="dial">'+Array.from({length:11},(_,i)=>'<span style="--a:'+(-135+i*27)+'deg">'+i+'</span>').join('')+'<input id="'+key+'" aria-label="'+labels[key]+'" type="range" min="0" max="10" step="0.1" value="'+values[key]+'"></div><label for="'+key+'">'+labels[key]+'</label><output for="'+key+'"></output>';document.getElementById('controls').append(c);const input=c.querySelector('input');const update=()=>{values[key]=+input.value;input.style.setProperty('--angle',(-135+values[key]*27)+'deg');c.querySelector('output').textContent=values[key].toFixed(1);sync()};input.addEventListener('input',update);input.addEventListener('wheel',e=>{e.preventDefault();input.value=+input.value+(e.deltaY<0?.1:-.1);update()},{passive:false});let start;input.addEventListener('pointerdown',e=>{e.preventDefault();start={y:e.clientY,v:+input.value};input.setPointerCapture(e.pointerId);input.focus()});input.addEventListener('pointermove',e=>{if(start){input.value=start.v+(start.y-e.clientY)/12;update()}});input.addEventListener('pointerup',()=>start=null);input.addEventListener('pointercancel',()=>start=null);input.style.touchAction='none';update()}
function init(){if(ctx)return;ctx=new AudioContext();osc=ctx.createOscillator();osc.type=document.getElementById('wave').value;osc.frequency.value=110;amp=ctx.createGain();bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=180;mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.7;treble=ctx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=3200;volume=ctx.createGain();volume.gain.value=0;delay=ctx.createDelay();delay.delayTime.value=.17;wet=ctx.createGain();feedback=ctx.createGain();feedback.gain.value=.32;osc.connect(amp).connect(bass).connect(mid).connect(treble).connect(volume).connect(ctx.destination);treble.connect(delay).connect(wet).connect(volume);delay.connect(feedback).connect(delay);osc.start();sync()}
function sync(){if(!ctx)return;const set=(p,v)=>p.setTargetAtTime(v,ctx.currentTime,.035);set(amp.gain,.03+values.gain*.025);set(bass.gain,(values.bass-5)*2.4);set(mid.gain,(values.mid-5)*2.4);set(treble.gain,(values.treble-5)*2.4);set(wet.gain,values.reverb*.065);set(volume.gain,powered&&playing?values.master*.045:0)}
for(const id of ['power','play'])document.getElementById(id).onclick=async()=>{init();await ctx.resume();if(id==='power')powered=!powered;else playing=!playing;document.body.classList.toggle('on',powered);document.getElementById('power').setAttribute('aria-pressed',powered);document.getElementById('play').setAttribute('aria-pressed',playing);document.getElementById('status').textContent=!powered?'Amplificador desligado.':playing?'Demonstração ativa · ajuste o timbre.':'Amplificador ligado · demonstração pausada.';sync()};
document.getElementById('wave').onchange=e=>{if(osc)osc.type=e.target.value};document.getElementById('finish').onclick=e=>{const active=document.body.classList.toggle('orange');e.target.setAttribute('aria-pressed',active)};document.addEventListener('visibilitychange',()=>{if(ctx){if(document.hidden)ctx.suspend();else if(powered&&playing)ctx.resume()}});
</script></html>
