<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurenne · Analog Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 20%,#414347,#090a0c 75%);color:#ddd;font:14px Georgia,serif;display:grid;place-items:center;padding:60px 24px}main{width:min(960px,100%)}.handle{position:relative;width:260px;height:38px;margin:0 auto 4px;border:9px solid #1b1714;border-bottom:0;border-radius:60% 60% 0 0;box-shadow:inset 0 3px 2px #796b56,0 -2px 2px #000}.handle:before,.handle:after{content:'';position:absolute;bottom:-8px;width:44px;height:14px;background:linear-gradient(#e9cf80,#715421);border-radius:5px;box-shadow:0 2px 4px #000}.handle:before{left:-28px}.handle:after{right:-28px}.case{position:relative;padding:34px 28px 25px;border-radius:17px;background:repeating-radial-gradient(ellipse at 13% 31%,#ffffff0c 0 1px,#0005 2px,#0000 3px 5px),linear-gradient(100deg,#171918,#30332e 35%,#090b09);border:2px solid #34372e;box-shadow:inset 0 3px 4px #b7b29166,inset 5px 0 5px #000, inset -7px -8px 6px #000,0 18px 22px #000b,0 45px 70px #0009;transform:perspective(1400px) rotateX(5deg)}.case:before{content:'';display:block;height:22px;margin:-29px -15px 15px;background:repeating-linear-gradient(90deg,#060807 0 3px,#353830 4px 6px);border-radius:10px 10px 0 0;box-shadow:inset 0 8px 9px #000}.brand{text-align:center;height:175px;padding:22px;border:1px solid #a58a42;border-radius:6px;background:radial-gradient(ellipse,#272d27,#0b0d0c);box-shadow:inset 0 0 25px #000,0 2px 2px #ffffff20}.brand h1{font:bold italic clamp(36px,7vw,66px) cursive;margin:0;color:#dddcd1;text-shadow:0 2px 1px #000,0 -1px 1px #fff}.brand p{letter-spacing:5px;font-size:10px;color:#afaa91}.panel{position:relative;margin-top:18px;padding:30px 25px 25px;border:2px solid #4c3917;border-radius:4px;color:#302613;background:repeating-linear-gradient(0deg,#ffffff16 0 1px,#00000009 1px 2px,transparent 2px 4px),linear-gradient(110deg,#8b672d,#e4cb79 32%,#c6a454 67%,#92702c);box-shadow:inset 0 2px 2px #fff8,inset 0 -3px 4px #332407,0 3px 5px #000}.screw{position:absolute;width:14px;height:14px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:conic-gradient(#fff3b5,#705222,#edcf76,#654819,#ffe9a1);filter:drop-shadow(1px 2px 1px #000);top:9px;left:9px}.screw:after{content:'';position:absolute;inset:6px 3px;background:#3c301d;transform:rotate(30deg)}.screw:nth-child(2){left:auto;right:9px;transform:rotate(73deg)}.controls{display:grid;grid-template-columns:repeat(6,1fr);gap:15px}.control{text-align:center;min-width:0}.dial{position:relative;width:88px;height:88px;margin:auto}.dial span{position:absolute;left:39px;top:39px;width:10px;font:bold 8px monospace;transform:rotate(var(--a)) translateY(-40px) rotate(calc(-1 * var(--a)))}input[type=range]{appearance:none;position:absolute;inset:19px;width:50px;height:50px;margin:0;border-radius:50%;background:conic-gradient(from 15deg,#b6b5a3,#fffef0 35deg,#686957 90deg,#dadbca 145deg,#545747 220deg,#f5f5de 280deg,#b6b5a3);border:3px solid #575847;box-shadow:0 5px 6px #0009,inset 0 0 0 2px #eeedcd,inset 0 0 6px #000;cursor:ns-resize;transform:rotate(var(--angle,-135deg))}input[type=range]::-webkit-slider-thumb{appearance:none;width:3px;height:18px;background:#24291e;transform:translateY(-12px);border-radius:2px}input[type=range]::-moz-range-thumb{width:3px;height:18px;background:#24291e;border:0}input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #f9f1bf;outline-offset:4px}label{display:block;font:bold 10px Georgia;letter-spacing:1px}output{display:block;font:10px monospace;margin-top:6px}.transport{display:flex;align-items:center;justify-content:center;gap:25px;margin-top:28px;padding-top:18px;border-top:1px solid #665326}button,select{font:bold 10px Georgia;letter-spacing:1px;color:#e0dfcc;background:linear-gradient(#484d45,#171d19);border:1px solid #151a13;border-radius:4px;padding:12px 17px;box-shadow:inset 0 1px 1px #ffffff55,0 3px 3px #0008;cursor:pointer}button[aria-pressed=true]{box-shadow:inset 0 3px 5px #000;background:#192019;color:#f8e7a8}.led{width:9px;height:9px;border-radius:50%;background:#420c08;box-shadow:inset 0 1px 2px #000}.on .led{background:#ff4830;box-shadow:0 0 5px #ff4a22,0 0 16px #ef311a}.feet{display:flex;justify-content:space-between;padding:0 70px}.feet i{width:70px;height:15px;background:linear-gradient(#101210,#30322b,#090a09);border-radius:0 0 7px 7px;box-shadow:0 5px 5px #000}footer{text-align:center;color:#a4a599;font:12px/1.7 Georgia;margin-top:32px}#status{min-height:20px;color:#d8c492}.orange .case{background:repeating-radial-gradient(ellipse at 13% 31%,#fff2 0 1px,#0005 2px,#0000 3px 5px),linear-gradient(100deg,#773207,#ca671d 35%,#8c3d0b)}@media(max-width:680px){.controls{grid-template-columns:repeat(3,1fr)}.transport{flex-wrap:wrap;gap:12px}.case{padding:25px 15px}.panel{padding:25px 8px}.brand{height:140px}}
</style><main><div class="handle"></div><section class="case" aria-label="Amplificador Aurenne I-740"><div class="brand"><h1>Aurenne</h1><p>ANALOG STUDIO • I–740</p></div><div class="panel"><i class="screw"></i><i class="screw"></i><div class="controls" id="controls"></div><div class="transport"><span class="led" aria-hidden="true"></span><button id="power" aria-pressed="false">POWER</button><button id="play" aria-pressed="false">DEMONSTRAÇÃO</button><select id="wave" aria-label="Forma de onda"><option value="triangle">TRIANGLE</option><option value="sawtooth">SAWTOOTH</option><option value="sine">SINE</option></select><button id="finish" aria-pressed="false">TOLEX LARANJA</button></div></div></section><div class="feet"><i></i><i></i></div><footer><div id="status" role="status">Ligue o amplificador e ative a demonstração.</div>Arraste os controles, use as setas do teclado ou a roda do mouse.<br>Áudio sintetizado localmente · Nenhum recurso externo</footer></main>
<script>
'use strict';
const values={gain:3,bass:5,mid:5,treble:5,reverb:2,master:3},labels={gain:'GAIN',bass:'BASS',mid:'MIDDLE',treble:'TREBLE',reverb:'REVERB',master:'MASTER'};
let ctx,osc,amp,volume,bass,mid,treble,wet,delay,feedback,powered=false,playing=false;
for(const key of Object.keys(values)){const c=document.createElement('div');c.className='control';c.innerHTML='<div class="dial">'+Array.from({length:11},(_,i)=>'<span style="--a:'+(-135+i*27)+'deg">'+i+'</span>').join('')+'<input id="'+key+'" aria-label="'+labels[key]+'" type="range" min="0" max="10" step="0.1" value="'+values[key]+'"></div><label for="'+key+'">'+labels[key]+'</label><output for="'+key+'"></output>';document.getElementById('controls').append(c);const input=c.querySelector('input');const update=()=>{values[key]=+input.value;input.style.setProperty('--angle',(-135+values[key]*27)+'deg');c.querySelector('output').textContent=values[key].toFixed(1);sync()};input.addEventListener('input',update);input.addEventListener('wheel',e=>{e.preventDefault();input.value=+input.value+(e.deltaY<0?.1:-.1);update()},{passive:false});let start;input.addEventListener('pointerdown',e=>{e.preventDefault();start={y:e.clientY,v:+input.value};input.setPointerCapture(e.pointerId);input.focus()});input.addEventListener('pointermove',e=>{if(start){input.value=start.v+(start.y-e.clientY)/12;update()}});input.addEventListener('pointerup',()=>start=null);input.addEventListener('pointercancel',()=>start=null);input.style.touchAction='none';update()}
function init(){if(ctx)return;ctx=new AudioContext();osc=ctx.createOscillator();osc.type=document.getElementById('wave').value;osc.frequency.value=110;amp=ctx.createGain();bass=ctx.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=180;mid=ctx.createBiquadFilter();mid.type='peaking';mid.frequency.value=1000;mid.Q.value=.7;treble=ctx.createBiquadFilter();treble.type='highshelf';treble.frequency.value=3200;volume=ctx.createGain();volume.gain.value=0;delay=ctx.createDelay();delay.delayTime.value=.17;wet=ctx.createGain();feedback=ctx.createGain();feedback.gain.value=.32;osc.connect(amp).connect(bass).connect(mid).connect(treble).connect(volume).connect(ctx.destination);treble.connect(delay).connect(wet).connect(volume);delay.connect(feedback).connect(delay);osc.start();sync()}
function sync(){if(!ctx)return;const set=(p,v)=>p.setTargetAtTime(v,ctx.currentTime,.035);set(amp.gain,.03+values.gain*.025);set(bass.gain,(values.bass-5)*2.4);set(mid.gain,(values.mid-5)*2.4);set(treble.gain,(values.treble-5)*2.4);set(wet.gain,values.reverb*.065);set(volume.gain,powered&&playing?values.master*.045:0)}
for(const id of ['power','play'])document.getElementById(id).onclick=async()=>{init();await ctx.resume();if(id==='power')powered=!powered;else playing=!playing;document.body.classList.toggle('on',powered);document.getElementById('power').setAttribute('aria-pressed',powered);document.getElementById('play').setAttribute('aria-pressed',playing);document.getElementById('status').textContent=!powered?'Amplificador desligado.':playing?'Demonstração ativa · ajuste o timbre.':'Amplificador ligado · demonstração pausada.';sync()};
document.getElementById('wave').onchange=e=>{if(osc)osc.type=e.target.value};document.getElementById('finish').onclick=e=>{const active=document.body.classList.toggle('orange');e.target.setAttribute('aria-pressed',active)};document.addEventListener('visibilitychange',()=>{if(ctx){if(document.hidden)ctx.suspend();else if(powered&&playing)ctx.resume()}});
</script></html>
